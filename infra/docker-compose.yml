services:
  postgres:
    image: postgres:16-alpine
    container_name: timp_postgres_16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-timp_ceramica}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Inicialización automática con las especificaciones SQL del proyecto (Regla 1: montado read-only)
      - ../specs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Persistencia de datos en volumen nombrado
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-timp_ceramica}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
